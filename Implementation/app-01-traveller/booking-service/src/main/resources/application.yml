# Settings shared by every profile.
server:
  port: 8086

spring:
  application:
    name: mmts-booking
  profiles:
    default: demo          # run with H2 unless another profile is chosen
  jpa:
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

mmts:
  app-id: APP-01
  security:
    # Shared signing key for login tokens (JWT, HS256). Every MMTS application uses the same key.
    # Outside the demo, set the environment variable MMTS_JWT_SECRET instead.
    jwt-secret: ${MMTS_JWT_SECRET:mmts-demo-signing-key-change-me-0123456789abcdef}
    issuer: mmts-identity
    token-minutes: 60
  booking:
    # Key that signs QR tickets (HMAC-SHA256). Outside the demo, set MMTS_QR_KEY instead.
    qr-signing-key: ${MMTS_QR_KEY:mmts-booking-qr-demo-key-change-me-2026}
    hold-timeout-minutes: 10        # unpaid bookings older than this are cancelled
    expiry-check-ms: 60000          # how often the hold-expiry job runs
    default-surge-factor: 1.0       # taxi surge until Analytics service sends PRICING_RULES_UPDATED
    stub:                           # stand-in for TSP Integration Hub: known providers and fare per mode (paise)
      providers: [DMRC, DTC, ZIPRIDE, YULU, ZOOMCAR, MERU]
      fares-paise:
        METRO: 4000
        BUS: 1500
        SCOOTER: 14500
        BIKE: 3000
        CAR: 120000
        TAXI: 35000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
