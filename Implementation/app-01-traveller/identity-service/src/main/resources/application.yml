# Settings shared by every profile.
server:
  port: 8084

spring:
  application:
    name: mmts-identity
  profiles:
    default: demo          # run with H2 unless another profile is chosen
  jpa:
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

mmts:
  app-id: APP-01
  security:
    # Shared signing key for login tokens (JWT, HS256). Every MMTS application uses the same key.
    # Outside the demo, set the environment variable MMTS_JWT_SECRET instead.
    jwt-secret: ${MMTS_JWT_SECRET:mmts-group11-demo-signing-key-change-me-0123456789}
    issuer: mmts-identity
    token-minutes: 60
  # Settings of Identity service only (Externalization pattern: no values hard-coded in Java).
  identity:
    zone: Asia/Kolkata                     # licence dates are compared in India time
    # AES-256 key (Base64, 32 bytes) that encrypts licence numbers in the database (driver D2).
    # Demo key only; outside the demo set the environment variable MMTS_PII_KEY (from a secrets vault).
    encryption-key: ${MMTS_PII_KEY:iKPYf3oBawoVMJUsA8hqTGT3vvlDAZwZ2LwLBCqaFIk=}
    bcrypt-strength: 10                    # cost of the password hash (2^10 rounds)
    otp:
      validity-minutes: 5
      max-attempts: 5
    verification:
      async: true                          # DigiLocker check runs in the background (tests switch this off)
    licence-expiry-cron: "0 30 1 * * *"    # every night at 01:30 India time

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
