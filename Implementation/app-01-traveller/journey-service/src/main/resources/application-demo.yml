# Demo profile: everything runs inside the application, nothing to install.
# H2 runs in PostgreSQL-compatible mode so the same SQL works on real PostgreSQL.
spring:
  datasource:
    url: jdbc:h2:mem:mmts-journey;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
