# PostgreSQL profile: the same code, now on the real database named in the architecture document.
# Create the database first:  psql -U postgres -c "CREATE DATABASE mmts_contract_management"
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mmts_contract_management}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
